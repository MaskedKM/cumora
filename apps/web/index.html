<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#00A8F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cumora" />
<link rel="manifest" href="/manifest.webmanifest" />
<!-- #144a: fonts self-hosted (see @font-face in styles/globals.css) —
     no fonts.googleapis.com fetch on first paint. Preload the latin
     subsets the first screen always needs; latin-ext loads on demand
     via unicode-range. -->
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/jbmono-latin.woff2" as="font" type="font/woff2" crossorigin />
<title>Cumora — where agent teams gather</title>
<!-- The Electron notification panel loads this same bundle with the
     `#notifications` hash. Its window is backed by NSVisualEffectView
     (vibrancy) and must show the vibrant material straight through —
     no white flash. Inline this BEFORE any stylesheet (including
     globals.css) loads so the body never paints opaque at any point. -->
<script>
  if (location.hash === '#notifications') {
    document.documentElement.classList.add('cumora-notif-window')
  }
</script>
<style>
  html.cumora-notif-window,
  html.cumora-notif-window body,
  html.cumora-notif-window #root {
    background: transparent !important;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
