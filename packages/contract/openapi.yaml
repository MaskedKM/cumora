components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: 用户会话令牌;多租户路由另需 X-Company-Id 头
    agentRuntimeJWT:
      type: http
      scheme: bearer
      description: daemon 经 /api/agents/:id/runtime-token 领取的 per-agent JWT(2h)
    deviceToken:
      type: http
      scheme: bearer
      description: daemon 配对所得设备凭证(computers.pair 发放)
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    Id:
      type: object
      required: [id]
      properties:
        id: { type: string }
    ComputerKind: { type: string, enum: [local, vps] }
    ComputerStatus: { type: string, enum: [online, offline, busy] }
    EngineId: { type: string, enum: [claude, codex, grok, cursor, zcode] }
    ParticipantKind: { type: string, enum: [agent, human] }
    Status: { type: string, enum: [avail, working, thinking, waiting, resting] }
    ConversationKind: { type: string, enum: [group, direct, whisper, email] }
    MessageKind:
      type: string
      enum: [text, tool, attachment, whisper-link, thought, system, email, poll]
    # ── computers:DB 行直出,snake_case(与现役 ApiComputer 一致)──
    Computer:
      type: object
      required: [id, company_id, owner_user_id, name, kind, available_engines, status]
      properties:
        id: { type: string }
        company_id: { type: string }
        owner_user_id: { type: string, nullable: true }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ComputerKind' }
        available_engines:
          type: array
          items: { $ref: '#/components/schemas/EngineId' }
        status: { $ref: '#/components/schemas/ComputerStatus' }
        last_seen_at: { type: string, nullable: true, format: date-time }
        paired_at: { type: string, nullable: true, format: date-time }
        daemon_version: { type: string, nullable: true }
        daemon_supervised: { type: boolean, nullable: true }
        latest_daemon_version: { type: string, nullable: true }
        daemon_outdated: { type: boolean }
    # ── 以下人读域为 handler 手工映射,camelCase(与现役 web 类型一致)──
    Participant:
      type: object
      required: [id, kind, name, initial, avatarBg, status]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ParticipantKind' }
        name: { type: string }
        role: { type: string, nullable: true }
        initial: { type: string }
        avatarBg: { type: string }
        avatarUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/Status' }
        statusUpdatedAt: { type: string, format: date-time }
        bio: { type: string, nullable: true }
        tools: { type: array, items: { type: string }, nullable: true }
        systemPrompt: { type: string, nullable: true }
        model: { type: string, nullable: true }
        fastModel: { type: string, nullable: true }
        computerId: { type: string, nullable: true }
        engine: { type: string, nullable: true }
        email: { type: string, nullable: true }
        departedAt: { type: string, nullable: true, format: date-time }
    Conversation:
      type: object
      required: [id, kind, title, members, createdAt, updatedAt, unreadCount, lastMessage]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ConversationKind' }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        topic: { type: string, nullable: true }
        members: { type: array, items: { type: string } }
        pinned: { type: boolean }
        muted: { type: boolean }
        mutedUntil: { type: string, nullable: true, format: date-time }
        tag: { type: string, nullable: true }
        pulledBy:
          type: object
          nullable: true
          required: [agentId, at, reason]
          properties:
