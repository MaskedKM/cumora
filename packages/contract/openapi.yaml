openapi: 3.0.3
info:
  title: Cumora API
  version: 0.2.2
  description: |
    Cumora 单一契约源(ADR 0004 · 票 #48)。覆盖全部存活路由域:
    core(auth/me/companies/invitations)、computers/agents、conversations/messages、
    email、projects、participants、boards、calendar、documents、push、uploads、
    workspaces、observability、devtools、admin、shipping、runtime(BYOA daemon 专用面)。

    ## WebSocket / SSE 事件面描述策略

    本规范只描述 HTTP 面。两条长连接通道不建模为 paths:

    - **WebSocket `/ws`** — 实时事件广播(message.new/delta、typing、participants/
      computers 状态、board/doc/calendar 变更等,载荷见 web 端 WsEvent 联合类型)。
      连接鉴权走 `/auth/ws-ticket` 票据。
    - **SSE `/runtime/wake-stream`** — daemon 唤醒流(wake/steer 两类事件)。

    两条通道的载荷形状刻意不入 components(逐事件契约由 #49 的 wire 级验收镜像
    测试承载——同一套测试跑 TS 与 Go,差异即回归);规范只负责 HTTP 面。

    ## 鉴权

    - `sessionBearer` — 用户会话(Authorization: Bearer <token> + X-Company-Id 租户头)
    - `agentRuntimeJWT` — BYOA daemon 的 per-agent runtime JWT(/runtime/* 全域)
    - `deviceToken` — daemon 设备凭证(/api/computers/pair 等)
    - 部分路由匿名(public/livez/og/auth 回调)
servers:
  - url: /
  - url: http://localhost:5181
tags:
  - { name: core }
  - { name: computers }
  - { name: agents }
  - { name: conversations }
  - { name: email }
  - { name: projects }
  - { name: participants }
  - { name: boards }
  - { name: calendar }
  - { name: documents }
  - { name: push }
  - { name: uploads }
  - { name: workspaces }
  - { name: observability }
  - { name: devtools }
  - { name: admin }
  - { name: shipping }
  - { name: runtime }
security:
  - sessionBearer: []
paths:
  /uploads:
    get:
      summary: Local-mode upload file serving (#69 webapp)
      responses:
        '200':
          description: File bytes (Content-Type per object; nosniff; non-preview bitmaps attachment)
        '404':
          description: Missing key
  /ws:
    get:
      summary: WebSocket gateway (chat/ws bus)
      responses:
        '101':
          description: Switching Protocols
  /webhooks/email/inbound:
    post:
      tags: [core]
      operationId: emailInboundWebhook
      security: []
      summary: Cloudflare email-gate 入站邮件回调(HMAC 签名验证,自有 JSON 解析器)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: ok }
        '400': { description: 报文非法 }
        '401': { description: 签名不符 }
        '503': { description: 存储不可用 }
  /api/health:
    get:
      tags: [core]
      operationId: health
      security: []
      summary: 存活探测
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, ts]
                properties:
                  ok: { type: boolean }
                  ts: { type: integer }
  /api/livez:
    get:
      tags: [core]
      operationId: livez
      security: []
      summary: 无依赖存活探测
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/og:
    get:
      tags: [core]
      operationId: ogImage
      security: []
      summary: OG 图(二进制,非 JSON)
      responses:
        '200': { description: image/png }
  /api/auth/start/{provider}:
    get:
      tags: [core]
      operationId: authStart
      security: []
      summary: OAuth 跳转(302,浏览器导航)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: return, in: query, schema: { type: string } }
        - { name: invite, in: query, schema: { type: string } }
      responses:
        '302': { description: 重定向至 IdP }
  /api/auth/callback/{provider}:
    get:
      tags: [core]
      operationId: authCallback
      security: []
      summary: OAuth 回调(落地 AUTH_DONE_URL)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: 重定向回应用 }
  /api/auth/apple/native:
    post:
      tags: [core]
      operationId: authAppleNative
      security: []
      summary: iOS 原生 SIWA(identity_token 换会话)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [identityToken]
              properties:
                identityToken: { type: string }
                name: { type: string, nullable: true }
                inviteToken: { type: string, nullable: true }
      responses:
        '200':
          description: 会话
          content:
            application/json:
              schema:
                type: object
                required: [token, user, companyId]
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      displayName: { type: string }
                  companyId: { type: string, nullable: true }
  /api/auth/logout:
    post:
      tags: [core]
      operationId: authLogout
      summary: 注销当前会话
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/auth/ws-ticket:
    post:
      tags: [core]
      operationId: authWsTicket
      summary: 换取一次性 WS 票据
      responses:
        '200':
          description: ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
  /api/auth/me:
    get:
      tags: [core]
      operationId: authMe
      summary: 当前用户 + 公司列表 + 服务能力
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
  /api/me:
    get:
      tags: [core]
      operationId: me
      summary: 当前参与者概要
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name, kind]
                properties:
                  id: { type: string }
                  name: { type: string }
                  kind: { type: string }
  /api/me/account:
    delete:
      tags: [core]
      operationId: deleteAccount
      summary: 注销账户(软删 + PII 清除)
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/me/quota:
    get:
      tags: [core]
      operationId: getQuota
      summary: sub2api 配额快照
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaResponse' } } } }
  /api/me/preferences:
    get:
      tags: [core]
      operationId: getPreferences
      summary: 用户偏好(自由 KV)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    put:
      tags: [core]
      operationId: putPreferences
      summary: 整体覆写偏好
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/companies:
    get:
      tags: [core]
      operationId: listCompanies
      summary: 我的公司列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanySummary' }
    post:
      tags: [core]
      operationId: createCompany
      summary: 建公司
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name, slug, role]
                properties:
                  id: { type: string }
                  name: { type: string }
                  slug: { type: string }
                  role: { type: string }
  /api/companies/{id}/invitations:
    get:
      tags: [core]
      operationId: listInvitations
      summary: 公司邀请列表(owner/admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
    post:
      tags: [core]
      operationId: createInvitation
      summary: 铸造邀请(token 只返回一次)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, nullable: true }
                role: { type: string, enum: [member, admin] }
                note: { type: string, nullable: true }
                multiUse: { type: boolean }
                maxUses: { type: integer }
                sendEmail: { type: boolean }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationWithToken' } } } }
  /api/companies/{id}/invitations/{inviteId}:
    delete:
      tags: [core]
      operationId: revokeInvitation
      summary: 吊销邀请
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked]
                properties:
                  ok: { type: boolean }
                  revoked: { type: boolean }
  /api/invitations/{token}:
    get:
      tags: [core]
      operationId: previewInvitation
      security: []
      summary: 公开预览邀请
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationPreview' } } } }
  /api/invitations/{token}/accept:
    post:
      tags: [core]
      operationId: acceptInvitation
      summary: 兑现邀请(幂等)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAccept' } } } }
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [projects]
      operationId: createProject
      summary: 建项目
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, name, description, color, status]
                properties:
                  id: { type: string }
                  name: { type: string }
                  description: { type: string }
                  color: { type: string, nullable: true }
                  status: { type: string }
  /api/projects/{id}:
    put:
      tags: [projects]
      operationId: updateProject
      summary: 改项目
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                color: { type: string, nullable: true }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/projects/{id}/archive:
    post:
      tags: [projects]
      operationId: archiveProject
      summary: 归档/恢复项目
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                archive: { type: boolean }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
  /api/participants:
    get:
      tags: [participants]
      operationId: getParticipants
      summary: 全员(人+agent)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Participant' }
  /api/computers:
    get:
      tags: [computers]
      operationId: getComputers
      summary: 本公司计算机(遗留 cloud 行已由 kind 守卫排除)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Computer' }
    post:
      tags: [computers]
      operationId: requestPairingCode
      summary: 申请配对码(持久公司级)
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
                  expiresInSeconds: { type: integer, nullable: true }
  /api/computers/{id}:
    delete:
      tags: [computers]
      operationId: deleteComputer
      summary: 吊销计算机(设备令牌+派生 JWT 全失效)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/computers/{id}/repair:
    post:
      tags: [computers]
      operationId: repairComputer
      summary: 重连码(保留计算机与其 agent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
                  expiresInSeconds: { type: integer, nullable: true }
  /api/computers/pair:
    post:
      tags: [computers]
      operationId: pairComputer
      security: [{ deviceToken: [] }]
      summary: daemon 兑换配对码 → 设备凭证
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                hostName: { type: string }
                engines: { type: array, items: { type: string } }
                version: { type: string }
                supervised: { type: boolean }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [computerId, deviceToken]
                properties:
                  computerId: { type: string }
                  deviceToken: { type: string }
  /api/computers/me/agents:
    get:
      tags: [computers]
      operationId: listAgentsForComputer
      security: [{ deviceToken: [] }]
      summary: daemon 拉取其托管的 agent 名册
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/computers/heartbeat:
    post:
      tags: [computers]
      operationId: heartbeatComputer
      security: [{ deviceToken: [] }]
      summary: daemon 心跳(30s)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/agents/{id}/runtime-token:
    post:
      tags: [agents]
      operationId: mintAgentRuntimeToken
      security: [{ deviceToken: [] }]
      summary: daemon 为 agent 铸 2h runtime JWT
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
  /api/agents:
    post:
      tags: [agents]
      operationId: createAgent
      summary: 建 agent
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Id' } } } }
  /api/agents/{id}:
    put:
      tags: [agents]
      operationId: updateAgent
      summary: 改 agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
    delete:
      tags: [agents]
      operationId: offboardAgent
      summary: 离岸(软删)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, departedAt]
                properties:
                  ok: { type: boolean }
                  departedAt: { type: string, format: date-time }
  /api/agents/{id}/rehire:
    post:
      tags: [agents]
      operationId: rehireAgent
      summary: 复聘
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/agents/{id}/avatar/generate:
    post:
      tags: [agents]
      operationId: generateAgentAvatar
      summary: AI 生成头像
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
  /api/agents/{id}/computer:
    post:
      tags: [agents]
      operationId: assignAgentComputer
      summary: 指派计算机+引擎
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [computerId]
              properties:
                computerId: { type: string }
                engine: { $ref: '#/components/schemas/EngineId' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, kind, engine]
                properties:
                  ok: { type: boolean }
                  kind: { $ref: '#/components/schemas/ComputerKind' }
                  engine: { $ref: '#/components/schemas/EngineId' }
  /api/agents/autonomy:
    get:
      tags: [agents]
      operationId: getAllAutonomy
      summary: 自主度全表
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Autonomy' }
  /api/agents/{id}/autonomy:
    get:
      tags: [agents]
      operationId: getAutonomy
      summary: 单 agent 自主度
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Autonomy' } } } }
    put:
      tags: [agents]
      operationId: putAutonomy
      summary: 设自主度阈值
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [threshold]
              properties:
                threshold: { type: integer }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ok, threshold]
                properties:
                  ok: { type: boolean }
                  threshold: { type: integer }
  /api/conversations:
    get:
      tags: [conversations]
      operationId: getConversations
      summary: 会话列表(含未读/预览)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
    post:
      tags: [conversations]
      operationId: createGroup
      summary: 建群聊
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, members]
              properties:
                title: { type: string }
                members: { type: array, items: { type: string } }
                subtitle: { type: string }
                projectId: { type: string, nullable: true }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, members, projectId]
                properties:
                  id: { type: string }
                  members: { type: array, items: { type: string } }
                  projectId: { type: string, nullable: true }
  /api/conversations/direct:
    post:
      tags: [conversations]
      operationId: openDirect
      summary: 开/复用 DM
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [otherId]
              properties:
                otherId: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, created]
                properties:
                  id: { type: string }
                  created: { type: boolean }
  /api/conversations/{id}/topic:
    post:
      tags: [conversations]
      operationId: setTopic
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      summary: 设主题行
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                topic: { type: string, nullable: true }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  topic: { type: string, nullable: true }
  /api/conversations/{id}/title:
    post:
      tags: [conversations]
      operationId: setTitle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
