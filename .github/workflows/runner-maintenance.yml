# ser8 runner fleet disk hygiene — keeps the self-hosted CI from slowly
# filling the host disk again (the failure that took the fleet down on
# 2026-08-26: `no space left on device` during job-container image pulls).
#
# Two accumulation sources on a self-hosted runner:
#   1. Rolling-tag images (node:24-bookworm, golang:1.24-*, pgvector:pg16…):
#      each upstream rebuild pulls fresh layers; the old ones turn dangling
#      and nothing removes them.
#   2. Root-owned residue in _work: a job that dies before its
#      `if: always()` chown step (cancelled, disk-full, infra kill) leaves
#      container-root-owned files the runner user cannot clean at the next
#      job's workspace cleanup.
#   3. CI host caches (#115): pr.yml bind-mounts /var/lib/cumora-ci-cache
#      (Go build/mod + npm + source tarballs) into job containers — they
#      grow across runs
#      by design. Expected magnitude is a few GB (Go build cache <2GB,
#      npm <1GB, tarballs <0.5GB capped at 10 newest); the `du` below
#      surfaces the trend so it
#      never becomes a second 240GB surprise. `docker prune` never
#      touches these (they're plain host directories, not docker
#      resources).
#
# Runs directly on the runner host (NO container) on a nightly schedule
# plus manual dispatch. Trust boundary: `schedule` always executes the
# workflow file from the DEFAULT branch, so a PR can never alter what runs
# here; there is no pull_request trigger, so PR code is never executed
# outside a container. Steps only touch docker garbage and file ownership
# inside the runner's own _work — `system prune` without --volumes/--all
# never removes tagged images in use or any volume data.
#
# NOTE: both runner slots live on the same host and share one docker
# daemon, so one prune covers the fleet; the _work chown is best-effort
# for whichever runner picks the job up.

name: Runner maintenance

on:
  schedule:
    # 03:30 Beijing time (19:30 UTC) — quiet hours, before the workday.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: 顺带跑 prune job(盘满救援/常规清理;默认只烘镜像)
        type: boolean
        default: false
    # #292 bootstrap 注意:首次烘焙/配方更新后想立即生效,可以
    # `gh workflow run runner-maintenance.yml --ref <分支>` 从分支
    # dispatch(schedule 只认默认分支,dispatch 可指分支)。dispatch
    # 默认只跑 bake——单 runner 队列上别被 prune 的时长挡住烘焙;
    # 盘满救援路径保留 = dispatch 时勾 prune。

permissions:
  # bake job 需要 checkout 读 ci/images/ 配方;仍是只读。
  contents: read

jobs:
  prune:
    name: Docker prune + _work ownership rescue
    # 夜间 schedule 两 job 都跑;dispatch 默认只跑 bake(见上)。
    if: github.event_name == 'schedule' || inputs.prune == true
    runs-on: [self-hosted, linux, ser8]
    timeout-minutes: 10
    steps:
      # No stderr suppression: a permission-denied here (root-owned
      # subdirs under the cache) is exactly the signal this report exists
      # to surface — du's nonzero exit is still swallowed by || true so
      # the step never fails the job.
      - name: Disk state before
        run: df -h / && docker system df && du -sh /var/lib/cumora-ci-cache/* || true
      # Dangling images (old rolling-tag layers), stopped containers, unused
      # networks. NOT --all (tagged images stay cached for fast job startup),
      # NOT --volumes (never risks data).
      - name: Prune docker garbage
        run: docker system prune -f
      # Build cache was the #1 disk hog on this host (240GB over months of
      # other projects' image builds — the 2026-08-26 outage's root cause).
      # Keep 72h of cache so iterative builds stay fast; older layers rebuild
      # on demand.
      - name: Prune stale build cache
        run: docker builder prune -f --filter until=72h
      # Return container-root-owned residue under this runner's _work to the
      # runner user, so its own workspace cleanup can delete it again. Uses
      # the node image already cached by the CI jobs (no extra pull).
      - name: Rescue root-owned _work residue
        run: |
          WORK="$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
          echo "work root: $WORK"
          OWNER="$(id -u):$(id -g)"
          if [ "$(find "$WORK" -xdev -uid 0 -print -quit)" ]; then
            docker run --rm -v "$WORK":/w node:24-bookworm chown -R "$OWNER" /w
          else
            echo "no root-owned residue — nothing to do"
          fi
      - name: Disk state after
        run: df -h / && docker system df && du -sh /var/lib/cumora-ci-cache/* || true

  bake:
    name: Bake CI images → local registry (127.0.0.1:5000)
    # #292:pr.yml 两 job 的容器镜像来自**本机 registry**(127.0.0.1:5000,
    # 常驻容器 cumora-ci-registry,数据落具名卷)。为什么不是本地 tag:
    # runner(2.336 实测)对 job 容器无条件 `docker pull`,本地独有 tag
    # 必然 manifest unknown → job 死;127.0.0.1 registry 可被 pull(docker
    # 默认把 127.0.0.0/8 视为 insecure,明文 HTTP 直通)。nightly 幂等:
    # registry 在=跳过,build 层缓存命中=秒级,基础镜像 best-effort 刷新。
    # 配方 = ci/images/*.Dockerfile。与 prune job 无冲突:registry 容器
    # 在跑(prune 只清已停容器),具名卷 prune 不带 --volumes 永不碰。
    # docker build 内无 job env,代理经 build-arg 指 docker0 网关的
    # Mihomo(*:7890 allow-lan);解析失败退化为直连烘(配方不变,慢)。
    runs-on: [self-hosted, linux, ser8]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure local registry (cumora-ci-registry @ 127.0.0.1:5000)
        run: |
          if ! docker ps --all --filter name=cumora-ci-registry --format '{{.Names}}' | grep -q .; then
            for i in 1 2 3; do docker pull registry:2 && break; sleep 5; done
            docker run -d --name cumora-ci-registry --restart=always \
              -p 127.0.0.1:5000:5000 -v cumora-ci-registry:/var/lib/registry registry:2
          fi
          docker start cumora-ci-registry 2>/dev/null || true
          for i in $(seq 1 20); do
            timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/5000' 2>/dev/null && break
            sleep 3
          done
          timeout 2 bash -c 'echo > /dev/tcp/127.0.0.1/5000' 2>/dev/null \
            || { echo "::error::本地 registry 60s 未就绪"; exit 1; }
          echo "registry ready"
      - name: Resolve docker0 gateway for the build-time proxy
        run: |
          GW="$(ip -4 addr show docker0 | awk '/inet /{print $2}' | cut -d/ -f1)"
          if [ -n "$GW" ]; then
            echo "PROXY_ARGS=--build-arg http_proxy=http://$GW:7890 --build-arg https_proxy=http://$GW:7890" >> "$GITHUB_ENV"
            echo "build proxy: http://$GW:7890"
          else
            echo "PROXY_ARGS=" >> "$GITHUB_ENV"
            echo "::warning::docker0 网关解析失败,build 直连(出口抖时可能失败,nightly 会再试)"
          fi
      # 基础镜像刷新是 best-effort:失败只降级为用本地缓存底烘(tag 滚动
      # 更新本来就有平率,夜间自愈)。
      - name: Refresh base images (best-effort)
        run: |
          for img in golang:1.24-alpine golang:1.24-bookworm node:24-bookworm; do
            docker pull "$img" || echo "::warning::$img 刷新失败,用本地缓存底继续"
          done
      - name: Build + push golang-alpine-ci:1.24
        run: |
          docker build $PROXY_ARGS -t 127.0.0.1:5000/golang-alpine-ci:1.24 - < ci/images/golang-alpine-ci.Dockerfile
          docker push 127.0.0.1:5000/golang-alpine-ci:1.24
      - name: Build + push golang-bookworm-ci:1.24
        run: |
          docker build $PROXY_ARGS -t 127.0.0.1:5000/golang-bookworm-ci:1.24 - < ci/images/golang-bookworm-ci.Dockerfile
          docker push 127.0.0.1:5000/golang-bookworm-ci:1.24
      # 真实拉回验证——job 容器走的正是这条 pull 路径,绿=CI 必能起容器
      # (教训:此前 `docker images|grep||true` 把空结果掩蔽成成功)。
      - name: Verify registry serves both images (real pull)
        run: |
          docker pull 127.0.0.1:5000/golang-alpine-ci:1.24
          docker pull 127.0.0.1:5000/golang-bookworm-ci:1.24
