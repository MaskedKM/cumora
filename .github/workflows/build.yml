# CI on every push to main: typecheck + unit + integration.
# (#132: the big-brain/llm-tracked static guards retired — their TS scan
#  surface was deleted in #70; LLM calls now live behind the Go daemon's
#  local triage gate.)
# (ADR 0003: hard fork, single-box self-host — no GKE images are built
# or pushed anymore. The Go server deploys as a local binary via systemd —
# see docs/SWITCHOVER.md; the TS Dockerfile was retired in #132.)

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # finish in-flight runs; cheaper than wasted work

jobs:
  typecheck:
    # (#70 注:本工作流当前 disabled_manually;文案随 TS 退役更新。)
    # Direct pushes to main bypass pr.yml entirely — typecheck gates the
    # harness + web sources against drift (TS 运行时已退役). Without this gate, a commit that adds
    # `import { foo } from '../bar'` but forgets to stage the matching
    # `export function foo` in bar.ts looks green until the server
    # crashloops on first start. Fail-fast HERE instead.
    name: Typecheck (server + client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: tsc (client)
        run: npm run typecheck
      - name: tsc (integration tests)
        run: npm run integration:typecheck

  quality:
    name: Guards + unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install Email Worker dependencies
        run: npm ci --prefix workers/email-gate
      - name: Lint (Biome)
        run: npm run lint
      - name: Unit tests
        run: npm test --silent
      - name: Enable pgvector extension
        run: PGPASSWORD=cumora psql -h localhost -U cumora -d cumora_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Integration tests
        run: npm run test:integration
