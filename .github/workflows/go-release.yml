name: Go Release

# 自托管的 server/daemon 二进制发布流(#67,ADR 0004):
#   - 触发:my-custom / main 上的 v* tag(或手动 workflow_dispatch)。
#     **制品只从这两个受保护谱系的 CI 出**——"错谱系手工构建丢引擎"
#     的事故类别由此根除;fork PR 永不触发。
#   - 矩阵:linux / darwin × amd64 / arm64,单 job 交叉编译(纯 Go,
#     CGO_ENABLED=0,免 per-target runner)。
#   - 制品:每平台一个 tar.gz(cumora-server + cumora-daemon)+
#     SHA256SUMS;daemon 的自更新只认自家 releases 的这套资产(下载、
#     校验、原子自替换)。
#   - 跑在 ser8 自托管 runner(golang:1.24-alpine 容器,同 pr.yml go job
#     范式):GitHub-hosted 分钟数被账号 billing 锁拦,而自托管 job 派发
#     不受影响(锁生效期间 ser8 的 Runner maintenance 照常跑绿)。发布
#     低频,串行排队成本可接受;billing 解锁后可再评估切回 ubuntu-latest。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0 — no v prefix; used for draft naming)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, ser8]
    container:
      image: golang:1.24-alpine
    timeout-minutes: 20
    # tag 推送才真正发布;分支/手动触发的 paths 变更只做构建冒烟(不发布)。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      GOCACHE: /tmp/gocache
      CGO_ENABLED: '0'
      # 与 pr.yml go job 同因:容器 root 的 git 拒绝 runner 属主的 checkout
      # ("dubious ownership")。二进制本就以 -trimpath 发布,无需 VCS 戳。
      GOFLAGS: -buildvcs=false
    steps:
      # 镜像自带 go,但缺 bash/git/gh,且必须在 checkout 之前装齐:
      #   git  — checkout@v4 探测不到 git(≥2.18)会回退 REST tarball,
      #          工作区就没有 .git,下面的谱系门会直接失败(ser8 上 pr.yml
      #          go job 的日志实证过这条回退路径);
      #   bash — runner 无 bash 时步骤回退 busybox sh,而下面各步用了
      #          `[[ ]]`/pipefail 这些 bash 语义,装上后自动改用 bash;
      #   gh   — 发布上传工具。
      - name: Install tooling (git for checkout+lineage gate, bash for the shell steps, gh for upload)
        shell: sh
        run: apk add --no-cache bash git github-cli

      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # dispatch 路径:GITHUB_REF_NAME 是分支名,不可当版本嵌进二进制
            echo "version=${{ inputs.version || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi

      # 谱系门(评审 m1):tag 必须落在 my-custom 或 main 上——否则任何
      # 分支推个 v* 都能发制品,"只从受保护谱系出"就是空话。
      - name: Lineage gate (tag must sit on my-custom or main)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --quiet origin my-custom main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -E 'origin/(my-custom|main)$'; then
            echo "::error::tag $GITHUB_REF_NAME is not on my-custom/main — refusing to publish"
            exit 1
          fi

      - name: Build matrix (server + daemon, 4 targets / 8 binaries)
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            dir="dist/cumora-${os}-${arch}"
            mkdir -p "$dir"
            # 两个嵌套 Go 模块:须在各自模块目录内构建(无根 go.mod/go.work)
            (cd apps/byoa-daemon && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X github.com/MaskedKM/cumora/apps/byoa-daemon/internal/daemon.Version=${VER}" \
              -o "../../$dir/cumora-daemon" ./cmd/cumora)
            (cd apps/server-go && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../../$dir/cumora-server" ./cmd/server)
            (cd dist && tar czf "cumora-${os}-${arch}.tar.gz" "cumora-${os}-${arch}")
            rm -rf "$dir"
          done
          (cd dist && sha256sum cumora-*.tar.gz > SHA256SUMS)
          ls -la dist/

      - name: Compose release notes
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'NOTES'
          自托管二进制发布(linux/darwin × amd64/arm64)。

          - `cumora-<os>-<arch>.tar.gz` 内含 `cumora-server` 与 `cumora-daemon`
          - `SHA256SUMS` 全量校验(daemon 自更新强制核对)
          - daemon 安装:`cumora-daemon agent computer --pair <code> --server <url> && cumora-daemon agent computer --install-service`
          - 自更新:仅查本 releases;supervised 形态空闲时自动下载→校验→自替换→重启
          - npm 包 `cumora` 已停版,见其 README
          NOTES
          sed -i 's/^          //' /tmp/notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == v* ]]; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "cumora $TAG" --generate-notes --notes-file /tmp/notes.md
          else
            VERSION="${{ steps.ver.outputs.version }}"
            gh release create "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS \
              --title "cumora v${VERSION}" --generate-notes --prerelease --notes-file /tmp/notes.md || \
              gh release upload "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS --clobber
          fi

      # Same ownership give-back as pr.yml's container jobs — this job's
      # checkout also writes container-root-owned files into the shared
      # workspace on the runner host.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"
