name: Go Release

# 自托管的 server/daemon 二进制发布流(#67,ADR 0004):
#   - 触发:my-custom / main 上的 v* tag(或手动 workflow_dispatch)。
#     **制品只从这两个受保护谱系的 CI 出**——"错谱系手工构建丢引擎"
#     的事故类别由此根除;fork PR 永不触发。
#   - 矩阵:linux / darwin × amd64 / arm64,单 job 交叉编译(纯 Go,
#     CGO_ENABLED=0,免 per-target runner)。
#   - 制品:每平台一个 tar.gz(cumora-server + cumora-daemon +
#     cumora-sidecar[#280 起,bun 编译自包含单二进制]+ migrations/,
#     #211 起随包,部署目录自包含)+ SHA256SUMS;daemon 的
#     自更新只认自家 releases 的这套资产(下载、校验、原子自替换),
#     server 侧部署走 scripts/deploy/deploy-release.sh 同一套。
#   - sidecar 双 job 形态(#280 评审 P0):bun compile 的产物 libc 风格
#     继承构建宿主 —— alpine(musl)上编 linux-x64 出 musl 链接二进制,
#     生产 Ubuntu(glibc)上 ENOENT 崩溃循环,且 CI 冒烟(bookworm)结构
#     性看不见。故 sidecar 在 glibc(bookworm)的独立 job 编译,经
#     workflow artifact 交给 alpine 的 release job 打 tar;release job
#     保持 alpine(apk 装 gh 便利)。
#   - 跑在 ser8 自托管 runner(golang:1.24-alpine 容器,同 pr.yml go job
#     范式):GitHub-hosted 分钟数被账号 billing 锁拦,而自托管 job 派发
#     不受影响(锁生效期间 ser8 的 Runner maintenance 照常跑绿)。发布
#     低频,串行排队成本可接受;billing 解锁后可再评估切回 ubuntu-latest。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0 — no v prefix; used for draft naming)'
        required: false
        type: string

permissions:
  contents: write

env:
  # bun 钉版单源(sidecar job 安装与文档引用同此;pr.yml 冒烟腿各自钉,
  # 两文件间以版本号字符串对齐)。
  BUN_VERSION: 1.3.10

jobs:
  # ── #280:sidecar 编译(glibc 宿主)──────────────────────────────────
  # 非 glibc 宿主会把 musl 烙进 linux 产物(评审 P0 实锤);交叉编译的
  # 非 host 目标还需从 npm 拉 staged runtime(评审 P1 实锤,~90MB/目标)
  # ——故本 job:bookworm 容器 + 走 Mihomo 代理(pr.yml 同款)+ bun
  # 缓存卷(命中即零下载)+ 全步骤重试环。产物经宿主共享卷 relay 交给
  # release job(#296:账户 artifact 配额墙 + 每发版省 ~760MB 代理往返),
  # 不直接对外。
  sidecar:
    runs-on: [self-hosted, linux, ser8]
    container:
      image: node:24-bookworm
      options: --add-host=host.docker.internal:host-gateway
      volumes:
        - /var/lib/cumora-ci-cache/npmcache:/npm/cache
        - /var/lib/cumora-ci-cache/buncache:/root/.bun/install/cache
        - /var/lib/cumora-ci-cache/relay:/relay
    timeout-minutes: 20  # 冷跑(镜像拉取+3×~90MB staged runtime)可触及,对齐 release job
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      # 与 pr.yml checks job 同款出口代理配方(小写——libcurl/npm/bun
      # 的小写约定);no_proxy 兜本地。
      https_proxy: http://host.docker.internal:7890
      http_proxy: http://host.docker.internal:7890
      no_proxy: localhost,127.0.0.1
      npm_config_cache: /npm/cache
    steps:
      # node:24-bookworm 自带 node/npm/git(checkout 可用);runner 的
      # node-actions 运行时与容器无 musl 冲突(bookworm)。
      - uses: actions/checkout@v4

      # npm ci 拉 hoisted workspace 依赖(sidecar 无 dependencies 字段);
      # --ignore-scripts 跳过 electron 等下载,sidecar 纯 JS 依赖零依赖
      # 安装脚本(评审实证)。出口偶发掐流 → 重试环。
      # shell: bash —— 容器 job 默认 sh=bookworm 的 dash,不认 pipefail
      # (v0.3.0-go.7 首跑即死在第一行,#294;pr.yml checks job 同坑 #115)。
      - name: npm ci (sidecar bundling deps)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            npm ci --ignore-scripts && { ok=1; break; }
            echo "[sidecar] npm ci 第 $i 次失败,重试"
          done
          [ "$ok" = 1 ] || { echo "::error::npm ci 三次失败"; exit 1; }

      # bun 经 npm registry 安装(平台包 tarball 自带二进制;alpine 上
      # 由 bun 自家 postinstall 探 /etc/alpine-release 选 musl 变体——
      # 本 job 是 bookworm,选 glibc)。99MB 包过代理偶发掐流 → 重试环。
      - name: Install bun (pinned, via npm registry)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            npm install -g "bun@${BUN_VERSION}" && { ok=1; break; }
            echo "[sidecar] bun 安装第 $i 次失败,重试"
          done
          [ "$ok" = 1 ] || { echo "::error::bun 安装三次失败"; exit 1; }
          bun --version

      # 四目标编译:host 目标(bun-linux-x64)零下载;其余目标首次从
      # npm 拉 staged runtime(尊重代理;buncache 卷命中后 20ms 级)。
      # 重试环裹整个循环单目标粒度。
      - name: Compile sidecar (4 targets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-sidecar
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            ok=0
            for i in 1 2 3; do
              bun build --compile --target="$t" \
                apps/yjs-sidecar/src/main.ts \
                --outfile "dist-sidecar/sidecar-$t" && { ok=1; break; }
              echo "[sidecar] $t 第 $i 次编译失败(staged runtime 下载被掐?),重试"
            done
            [ "$ok" = 1 ] || { echo "::error::$t 三次编译失败"; exit 1; }
            ls -la "dist-sidecar/sidecar-$t"
          done

      # #296:宿主共享卷 relay 交接(替代 upload-artifact——账户级 artifact
      # 存储配额爆过一次,且经 GitHub 中转每发版多 ~760MB 代理往返;本舰队
      # 单 runner 同宿主,sidecar→release 顺序执行,本地卷直递即可)。
      # run 粒度目录防串台(rerun 同 run id 原地重写);sha256 清单供 release
      # 侧强校验;留最近 2 个 run 目录防膨胀(与 tarballs 缓存同款纪律)。
      - name: Relay sidecar binaries (host shared volume)
        shell: bash
        run: |
          set -euo pipefail
          DEST="/relay/run-${GITHUB_RUN_ID}"
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp dist-sidecar/* "$DEST/"
          (cd "$DEST" && sha256sum sidecar-* > SHA256SUMS.sidecar)
          ls -la "$DEST"
          ls -dt /relay/run-* 2>/dev/null | tail -n +3 | xargs -r rm -rf

      # Same ownership give-back as pr.yml's container jobs.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"

  release:
    needs: sidecar
    runs-on: [self-hosted, linux, ser8]
    container:
      image: golang:1.24-alpine
      # #296:sidecar 产物经宿主共享卷 relay 直递(见 sidecar job)。
      volumes:
        - /var/lib/cumora-ci-cache/relay:/relay
    timeout-minutes: 20
    # tag 推送才真正发布;分支/手动触发的 paths 变更只做构建冒烟(不发布)。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      GOCACHE: /tmp/gocache
      CGO_ENABLED: '0'
      # 与 pr.yml go job 同因:容器 root 的 git 拒绝 runner 属主的 checkout
      # ("dubious ownership")。二进制本就以 -trimpath 发布,无需 VCS 戳。
      GOFLAGS: -buildvcs=false
    steps:
      # 镜像自带 go,但缺 bash/git/gh,且必须在 checkout 之前装齐:
      #   git  — checkout@v4 探测不到 git(≥2.18)会回退 REST tarball,
      #          工作区就没有 .git,下面的谱系门会直接失败(ser8 上 pr.yml
      #          go job 的日志实证过这条回退路径);
      #   bash — runner 无 bash 时步骤回退 busybox sh,而下面各步用了
      #          `[[ ]]`/pipefail 这些 bash 语义,装上后自动改用 bash;
      #   gh   — 发布上传工具。
      - name: Install tooling (git for checkout+lineage gate, bash for the shell steps, gh for upload)
        shell: sh
        run: apk add --no-cache bash git github-cli

      - uses: actions/checkout@v4

      # sidecar job(bookworm/glibc)的编译产物交接(评审 P0:alpine 上
      # 编 linux 产物会带 musl loader,生产 glibc 起不来)。#296:宿主
      # 共享卷 relay 直递 + sha256 强校验(目录缺失/校验不过=硬失败,
      # 等价于 download-artifact 的完整性保证)。
      - name: Collect sidecar binaries (from host relay)
        run: |
          set -euo pipefail
          RELAY="/relay/run-${GITHUB_RUN_ID}"
          if [ ! -d "$RELAY" ]; then
            echo "::error::relay 目录缺失:$RELAY —— sidecar job 未落盘?"
            exit 1
          fi
          (cd "$RELAY" && sha256sum -c SHA256SUMS.sidecar)
          mkdir -p dist-sidecar
          cp "$RELAY"/sidecar-* dist-sidecar/
          chmod 0755 dist-sidecar/sidecar-*

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # dispatch 路径:GITHUB_REF_NAME 是分支名,不可当版本嵌进二进制
            echo "version=${{ inputs.version || '0.0.0-manual' }}" >> "$GITHUB_OUTPUT"
          fi

      # 谱系门(评审 m1):tag 必须落在 my-custom 或 main 上——否则任何
      # 分支推个 v* 都能发制品,"只从受保护谱系出"就是空话。
      - name: Lineage gate (tag must sit on my-custom or main)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # checkout@v4 把 safe.directory 写进它自己的"临时 git global
          # config",对本步骤不可见;ser8 串行复用同一工作区,上一个 job
          # 的 give-back 已把属主还给 runner 用户,容器 root 的 git 因此
          # 拒绝(v0.3.0-go.1 首演练即栽在这里)。本 job 自己补一条。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --quiet origin my-custom main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -E 'origin/(my-custom|main)$'; then
            echo "::error::tag $GITHUB_REF_NAME is not on my-custom/main — refusing to publish"
            exit 1
          fi

      - name: Build matrix (server + daemon, 4 targets / 8 binaries + sidecar)
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            dir="dist/cumora-${os}-${arch}"
            mkdir -p "$dir"
            # #211:制品自带 migrations —— 版本化部署目录(releases/<ver>/)
            # 自包含,二进制与 schema 同版本落盘,systemd 不再指仓库工作树。
            # daemon 自更新只按 basename 抽 cumora-daemon
            # (selfupdate.go extractDaemonFromTarGz),多出的 migrations/
            # 与 sidecar 对其零影响(尺寸面:daemon 自更新会整包下载,
            # sidecar ~40-50MB gz 随之膨胀 —— #283 打包链再评估拆资产)。
            cp -r apps/server-go/migrations "$dir/migrations"
            # 两个嵌套 Go 模块:须在各自模块目录内构建(无根 go.mod/go.work)
            (cd apps/byoa-daemon && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X github.com/MaskedKM/cumora/apps/byoa-daemon/internal/daemon.Version=${VER}" \
              -o "../../$dir/cumora-daemon" ./cmd/cumora)
            (cd apps/server-go && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../../$dir/cumora-server" ./cmd/server)
            # #282:stack 管理面双二进制(纯 Go,同规则交叉编译)。
            (cd apps/stack && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../../$dir/cumora-stack" ./cmd/cumora-stack && \
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "../../$dir/cumora-stackd" ./cmd/cumora-stackd)
            # #280:sidecar 由 glibc sidecar job 编好(见上),此处仅落位;
            # bun 的 arch 名 x64/arm64(Go 的 amd64 → x64)。
            barch="x64"; [ "$arch" = arm64 ] && barch="arm64"
            cp "dist-sidecar/sidecar-bun-${os}-${barch}" "$dir/cumora-sidecar"
            chmod 0755 "$dir/cumora-sidecar"
            (cd dist && tar czf "cumora-${os}-${arch}.tar.gz" "cumora-${os}-${arch}")
            rm -rf "$dir"
          done
          (cd dist && sha256sum cumora-*.tar.gz > SHA256SUMS)
          ls -la dist/

      - name: Compose release notes
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'NOTES'
          自托管二进制发布(linux/darwin × amd64/arm64)。

          - `cumora-<os>-<arch>.tar.gz` 内含 `cumora-server`、`cumora-daemon`、`cumora-sidecar`(#280 起,bun 编译自包含单二进制)、`cumora-stack`/`cumora-stackd`(#282 起管理面)与 `migrations/`
          - `SHA256SUMS` 全量校验(daemon 自更新与 server 部署脚本均强制核对)
          - server 部署:`bash scripts/deploy/deploy-release.sh <tag>`(下载→校验→`~/.local/share/cumora/releases/<ver>`→切 current symlink→重启三件套)
          - daemon 安装:`cumora-daemon agent computer --pair <code> --server <url> && cumora-daemon agent computer --install-service`
          - 自更新:仅查本 releases;supervised 形态空闲时自动下载→校验→自替换→重启
          - npm 包 `cumora` 已停版,见其 README
          NOTES
          sed -i 's/^          //' /tmp/notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == v* ]]; then
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "cumora $TAG" --generate-notes --notes-file /tmp/notes.md
          else
            VERSION="${{ steps.ver.outputs.version }}"
            gh release create "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS \
              --title "cumora v${VERSION}" --generate-notes --prerelease --notes-file /tmp/notes.md || \
              gh release upload "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS --clobber
          fi

      # Same ownership give-back as pr.yml's container jobs — this job's
      # checkout also writes container-root-owned files into the shared
      # workspace on the runner host.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"
