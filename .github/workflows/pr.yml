# PR checks — fast feedback on every pull request to main / my-custom
# (the fork's working branch — the Go-migration ticket stream targets it).
#
# Runs on the ser8 self-hosted fleet (labels: self-hosted,linux,ser8).
# The two runner slots share one 4-core/4GB cgroup, so this workflow is
# exactly TWO jobs — quick (guards + lint + typecheck) and tests (unit +
# integration against service containers) — to match the fleet's
# parallelism and keep per-job npm ci overhead down. Host has Docker
# (service containers) but no node/psql — node comes from setup-node,
# pgvector is enabled via the repo's own pg client.
#
# Deliberate boundary: compilation/artifact work (electron-builder,
# docker image builds, releases) does NOT run on the self-hosted fleet.
#
# Self-hosted on a public repo: never run code from fork PRs — both
# jobs skip unless the PR head is this repo.

name: PR

on:
  pull_request:
    branches: [main, my-custom]

# Cancel superseded runs on the same PR — frees the two runner slots
# for the newest push instead of finishing stale ones.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick (guards + lint + typecheck)
    runs-on: [self-hosted, linux, ser8]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # P0 tripwire: the BIG (brain) model may ONLY do real, heavy tasks.
      # Fast static scan before anything else — see scripts/guard-big-brain.mjs.
      - name: Big-brain guard (P0)
        run: node scripts/guard-big-brain.mjs
      # P1 tripwire: every sub2api callsite must go through
      # getTrackedLlmClient() so the llm_calls ledger captures the spend.
      - name: LLM-tracked guard (P1)
        run: node scripts/guard-llm-tracked.mjs
      - name: Lint (Biome)
        run: npm run lint
      # `npm run typecheck` delegates to the apps/web workspace (root has
      # no tsconfig since the monorepo move); server keeps its own config.
      - name: Typecheck (client + server)
        run: npm run typecheck && npm run server:typecheck

  tests:
    name: Unit + integration
    runs-on: [self-hosted, linux, ser8]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    # `npm test` (server/src/__tests__ + workers) boots env.ts and opens
    # Postgres/Redis connections, so both suites need the same service
    # containers — without them tests hang on ECONNREFUSED until timeout.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@localhost:5432/cumora_test
      REDIS_URL: redis://localhost:6379
      # Force mock Resend — the runner enforces this too, but doubling
      # up here makes a misconfiguration loud. Values are dummy for CI.
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # `npm test` runs workers/**/*.test.ts too, and the email-gate
      # worker has its own dependencies (postal-mime) that the root
      # install doesn't pull in.
      - name: Install Email Worker dependencies
        run: npm ci --prefix workers/email-gate
      - name: Unit tests
        run: npm test --silent
      # Enable pgvector for the integration suite (unit tests don't need
      # it). The runner host has no psql — use the repo's pg client.
      - name: Enable pgvector extension
        run: >-
          node -e "const {Client}=require('pg');(async()=>{
          const c=new Client({connectionString:process.env.DATABASE_URL});
          await c.connect(); await c.query('CREATE EXTENSION IF NOT EXISTS vector');
          await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Integration tests
        run: npm run test:integration
