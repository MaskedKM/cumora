# PR checks — fast feedback on every pull request to main / my-custom
# (the fork's working branch — the Go-migration ticket stream targets it).
#
# Runs on the ser8 self-hosted fleet (labels: self-hosted,linux,ser8).
# The two runner slots share one 4-core/4GB cgroup, so this workflow is
# exactly TWO jobs — quick (guards + lint + typecheck) and tests (unit +
# integration against service containers) — to match the fleet's
# parallelism and keep per-job npm ci overhead down. BOTH jobs run in
# node:24 containers: PR code never executes as the host runner user
# (the runner is in the docker group, i.e. host-root-equivalent), and
# container jobs get git + node from the image with no setup-node.
# pgvector is enabled via the repo's own pg client (no host psql).
#
# Deliberate boundary: compilation/artifact work (electron-builder,
# docker image builds, releases) does NOT run on the self-hosted fleet.
#
# Self-hosted on a public repo: never run code from fork PRs — both
# jobs skip unless the PR head is this repo.

name: PR

on:
  pull_request:
    branches: [main, my-custom]

# Cancel superseded runs on the same PR — frees the two runner slots
# for the newest push instead of finishing stale ones.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Quick (guards + lint + typecheck)
    runs-on: [self-hosted, linux, ser8]
    container:
      image: node:24-bookworm
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    env:
      # CI never runs Electron — skip its ~100MB binary postinstall.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # P0 tripwire: the BIG (brain) model may ONLY do real, heavy tasks.
      # Static scan runs BEFORE npm ci — no install, no deps — so a
      # broken dependency tree can never mask the tripwire (the image
      # ships node already).
      - name: Big-brain guard (P0)
        run: node scripts/guard-big-brain.mjs
      # P1 tripwire: every sub2api callsite must go through
      # getTrackedLlmClient() so the llm_calls ledger captures the spend.
      - name: LLM-tracked guard (P1)
        run: node scripts/guard-llm-tracked.mjs
      - run: npm ci
      - name: Contract drift guard (routes ↔ openapi ↔ generated TS)
        run: npm run contract:check
      - name: Lint (Biome)
        run: npm run lint
      # `npm run typecheck` delegates to the apps/web workspace (root has
      # no tsconfig since the monorepo move); server keeps its own config.
      - name: tsc (client)
        run: npm run typecheck
      - name: tsc (server)
        run: npm run server:typecheck
      # Container runs as root but shares the workspace with the host
      # runner user — give ownership back (see the tests job's note).
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"

  tests:
    name: Unit + integration
    # The whole job runs IN a container on the runner's Docker. Services
    # share the job network and are reached by service name (postgres,
    # redis) — no host ports are published, so concurrent PRs (two runner
    # slots) and any services already on the host can never collide on
    # 5432/6379. node:24-bookworm ships node + git (the codex engine
    # tests init a git repo in the agent home).
    runs-on: [self-hosted, linux, ser8]
    container:
      image: node:24-bookworm
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Service hostnames resolve on the job's docker network.
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@postgres:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@postgres:5432/cumora_test
      REDIS_URL: redis://redis:6379
      # Force mock Resend — the runner enforces this too, but doubling
      # up here makes a misconfiguration loud. Values are dummy for CI.
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
      # Cerebellum API keys are encrypted at rest (ADR 0001) — the
      # settings round-trip integration tests need a key configured.
      CUMORA_SECRETS_KEY: ci-test-secrets-key
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # `npm test` runs workers/**/*.test.ts too, and the email-gate
      # worker has its own dependencies (postal-mime) that the root
      # install doesn't pull in.
      - name: Install Email Worker dependencies
        run: npm ci --prefix workers/email-gate
      # Some unit tests read app_settings (e.g. the agenda classifier's
      # cerebellum-route lookup), so the suite needs the schema present —
      # locally that's the dev DB; in CI we migrate the service DB first.
      # pgvector must be enabled BEFORE migrate (vector columns).
      - name: Enable pgvector extension
        run: >-
          node -e "const {Client}=require('pg');(async()=>{
          const c=new Client({connectionString:process.env.DATABASE_URL});
          await c.connect(); await c.query('CREATE EXTENSION IF NOT EXISTS vector');
          await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Migrate test schema
        run: npm run migrate
      - name: Unit tests
        run: npm test --silent
      - name: Integration tests
        run: npm run test:integration
      # The container runs as root but shares the workspace with the host
      # runner user — give ownership back so the next host job (quick)
      # can clean the workspace. Without this, root-owned files from the
      # container break the host job's checkout with EACCES.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"
