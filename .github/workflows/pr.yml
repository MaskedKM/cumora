# PR checks — fast feedback on every pull request to main / my-custom
# (the fork's working branch — the Go-migration ticket stream targets it).
#
# Runs on the ser8 self-hosted fleet (labels: self-hosted,linux,ser8).
# The two runner slots share one 4-core/4GB cgroup, so this workflow is
# TWO jobs — go (gofmt + vet + build + test, golang:1.24-alpine container) and
# checks (guards + lint + typecheck + unit + integration, node:24
# container + service containers) — matching the fleet's parallelism.
# (checks used to be two jobs, quick + tests; they merged in #115's CI
# speedup: one less checkout + npm ci, and 2 jobs fill 2 slots exactly.)
#
# Speed plumbing (#115, measured against a 49-minute baseline run):
#   - Egress through the host's Mihomo (allow-lan on *:7890, reached via
#     host-gateway). The ser8↔GitHub git link runs ~100KB/s and truncates
#     (early-EOF); through the proxy, checkout drops from ~4min to seconds.
#   - Persistent host caches bind-mounted from /var/lib/cumora-ci-cache
#     (Go build/mod + npm) — container layers die with the job, these
#     survive across runs. Monitored by runner-maintenance.yml.
#   - Integration suite split into 3 shards, each with its own Postgres
#     database and its own Redis instance (pub/sub is instance-wide;
#     Redis DB indexes would still cross-talk). Shards stay internally
#     serial (--test-concurrency=1 — concurrent TRUNCATEs on a shared
#     DB deadlock at the catalog-lock level).
#   - Source arrives as a codeload tarball, not actions/checkout (#166):
#     the git smart-HTTP exchange (POST /git-upload-pack — unbounded
#     streaming body) is the one traffic class the flaky upstream chokes
#     on at zero bytes, while plain GETs with Content-Length (tarball
#     included) stay fast. No .git dir — nothing in this workflow runs
#     git; the download step keeps a fail-fast ceiling like the old
#     checkout timeout did.
#
# ALL jobs run in containers: PR code never executes as the host runner
# user (runner is docker-group = host-root-equivalent). pgvector is
# enabled via the repo's own pg client.
#
# Deliberate boundary: heavy artifact work (electron-builder, docker
# image builds) does NOT run on the self-hosted fleet; the go job's
# compile is a check, not an artifact publish. (Go Release — the one
# artifact publish that DOES run here — lives in go-release.yml, moved
# onto ser8 in #67's follow-up because the account billing lock blocks
# GitHub-hosted minutes while self-hosted dispatch keeps working.)
#
# Self-hosted on a public repo: never run code from fork PRs — both
# jobs skip unless the PR head is this repo.

name: PR

on:
  pull_request:
    branches: [main, my-custom]
  # Manual lever: the pull_request event pipeline has gone silent before
  # (2026-08-28/29 — synchronize/opened created no runs) while API-initiated
  # actions kept working. Dispatch runs this same workflow on any branch
  # without webhook delivery; note it checks the branch head, not the PR
  # merge ref.
  workflow_dispatch:

# Cancel superseded runs on the same PR — frees the two runner slots
# for the newest push instead of finishing stale ones.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (gofmt + vet + build + test)
    runs-on: [self-hosted, linux, ser8]
    # Pure-Go module (pgx only, no cgo) — alpine is half the on-disk size of
    # bookworm on the runner, and vet/build don't need a C toolchain.
    container:
      image: golang:1.24-alpine
      # Egress via the host's Mihomo (see header) — git/go module fetches
      # only; the proxy host itself never proxies.
      options: --add-host=host.docker.internal:host-gateway
      # Persistent build caches on the runner host — survive the job's
      # container (the old /tmp/gocache died with every run: cold compile
      # each time, ~1m50s of the job).
      volumes:
        - /var/lib/cumora-ci-cache/gocache:/go/cache
        - /var/lib/cumora-ci-cache/gomodcache:/go/modcache
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    env:
      # Egress via the host's Mihomo (see header). Lowercase-only on
      # purpose: GitHub rejects env maps that define both cases of one
      # name, and libcurl only honors lowercase http_proxy for http://
      # URLs — lowercase alone covers git (libcurl), npm and go for both
      # schemes. Service names stay off the proxy path (pg/redis clients
      # don't proxy anyway — belt and braces).
      https_proxy: http://host.docker.internal:7890
      http_proxy: http://host.docker.internal:7890
      no_proxy: localhost,127.0.0.1,host.docker.internal
      GOCACHE: /go/cache
      GOMODCACHE: /go/modcache
      CGO_ENABLED: '0'
      # `go build` embeds VCS info by default when a .git dir exists; the
      # tarball pickup (#166) ships none, so auto would skip stamping on
      # its own — the flag stays as a belt against checkout ever coming
      # back (its root-owned .git trips "dubious ownership", exit 128).
      # The check binary is never shipped — no VCS stamping needed.
      GOFLAGS: -buildvcs=false
    steps:
      # git-free source pickup (#166): codeload tarball over a plain GET —
      # the smart-HTTP POST streams without Content-Length and is what the
      # upstream stalls on. Anonymous on purpose: codeload rejects requests
      # carrying an Authorization header (the api.github.com /tarball
      # redirect path 401s because of it), and the fork is public anyway.
      # The workspace wipe matters: the runner reuses _work across runs and
      # checkout used to clean it — without this, files deleted in later
      # commits would linger and poison builds. (alpine ships no curl —
      # apk add is itself a GET-class fetch through the same proxy.)
      - name: Download source (tarball, git-free)
        timeout-minutes: 5
        run: |
          apk add -q --no-cache curl
          curl -fsSL --connect-timeout 20 --retry 2 -o /tmp/repo.tar.gz \
            "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: gofmt check
        run: test -z "$(gofmt -l apps/server-go apps/byoa-daemon)" || (gofmt -l apps/server-go apps/byoa-daemon; exit 1)
      # #133: server-go 已有 httpx/contacts/runtime 单测,与 build 同容器
      # 零增量成本;不加 -run 过滤,后续新增 *_test.go 自动纳入。
      - name: vet + build + test (server)
        run: cd apps/server-go && go vet ./... && go build ./... && go test ./... -count=1
      # #63:BYOA daemon 是独立 Go 模块(单二进制,无 DB/Redis 依赖)——
      # vet + build + 协议级 stub-server 测试(stub 全进程内,无外部服务)。
      - name: vet + test (byoa-daemon)
        run: cd apps/byoa-daemon && go vet ./... && go test ./... -count=1
      # Same ownership give-back as the other job — this job's checkout also
      # writes container-root-owned files into the shared workspace.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"

  checks:
    name: Checks (guards + lint + typecheck + unit + integration)
    # The whole job runs IN a container on the runner's Docker. Services
    # share the job network and are reached by service name (postgres,
    # redis/redis2/redis3) — no host ports are published, so concurrent
    # PRs (two runner slots) and any services already on the host can
    # never collide on 5432/6379. Three Redis instances: pub/sub is
    # instance-wide, so the three integration shards each get their own
    # instead of sharing DB indexes.
    # #70 TS 退役:integration runner 自建 Go 服当 SUT——容器从
    # node:24 换 golang:1.24-bookworm(node 由 setup-node 叠 24),并挂
    # 与 go job 同源的持久 Go 缓存(SUT 构建不再每 run 冷编)。
    runs-on: [self-hosted, linux, ser8]
    container:
      image: golang:1.24-bookworm
      options: --add-host=host.docker.internal:host-gateway
      volumes:
        - /var/lib/cumora-ci-cache/npmcache:/npm/cache
        - /var/lib/cumora-ci-cache/gocache:/go/cache
        - /var/lib/cumora-ci-cache/gomodcache:/go/modcache
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'MaskedKM/cumora'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cumora
          POSTGRES_PASSWORD: cumora
          POSTGRES_DB: cumora_test
        options: >-
          --health-cmd "pg_isready -U cumora -d cumora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis2:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis3:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Egress via the host's Mihomo (see header). Lowercase-only on
      # purpose: GitHub rejects env maps that define both cases of one
      # name, and libcurl only honors lowercase http_proxy for http://
      # URLs — lowercase alone covers git (libcurl), npm and go for both
      # schemes. Service names stay off the proxy path (pg/redis clients
      # don't proxy anyway — belt and braces).
      https_proxy: http://host.docker.internal:7890
      http_proxy: http://host.docker.internal:7890
      no_proxy: localhost,127.0.0.1,postgres,redis,redis2,redis3,host.docker.internal
      npm_config_cache: /npm/cache
      GOCACHE: /go/cache
      GOMODCACHE: /go/modcache
      # Unit tests + non-sharded runs point here (shard steps override
      # INTEGRATION_DATABASE_URL/REDIS_URL per shard).
      # Service hostnames resolve on the job's docker network.
      INTEGRATION_DATABASE_URL: postgres://cumora:cumora@postgres:5432/cumora_test
      DATABASE_URL: postgres://cumora:cumora@postgres:5432/cumora_test
      REDIS_URL: redis://redis:6379
      # Force mock Resend — the runner enforces this too, but doubling
      # up here makes a misconfiguration loud. Values are dummy for CI.
      RESEND_API_KEY: ''
      EMAIL_DOMAIN: cumora.local
      EMAIL_INBOUND_HMAC_SECRET: ci-test-secret
      AUTH_SECRET: ci-test-auth-secret
      OPENAI_API_KEY: ci-test-openai-key
      # Cerebellum API keys are encrypted at rest (ADR 0001) — the
      # settings round-trip integration tests need a key configured.
      CUMORA_SECRETS_KEY: ci-test-secrets-key
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      # Same git-free pickup as the go job (#166) — bookworm ships curl,
      # so no apk step.
      - name: Download source (tarball, git-free)
        timeout-minutes: 5
        run: |
          curl -fsSL --connect-timeout 20 --retry 2 -o /tmp/repo.tar.gz \
            "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
          # contract-check.sh (#48 guard) regenerates and diffs against
          # HEAD; with no checkout there is no HEAD — synthesize one from
          # the pristine tarball so "committed state" == branch head content.
          # safe.directory bootstrap first: the workspace root is the host
          # runner user's bind mount, and container-root git refuses repos
          # owned by another uid (same dance checkout/contract-check do).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q -b main
          git add -A
          git -c user.email=cumora-ci@example.com -c user.name=cumora-ci \
            commit -qm "tarball baseline"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # #132: big-brain / llm-tracked 守卫退役——扫描面(TS LLM 调用)已随
      # #70 删净,LLM 调用全在 Go 侧(byoa-daemon 本地小脑门控 + 代码评审),
      # 两个脚本对残余 TS 面(sidecar/workers/harness)零命中空转。
      - run: npm ci
      # `npm test` runs workers/**/*.test.ts too, and the email-gate
      # worker has its own dependencies (postal-mime) that the root
      # install doesn't pull in.
      - name: Install Email Worker dependencies
        run: npm ci --prefix workers/email-gate
      - name: Contract drift guard (routes ↔ openapi ↔ generated TS)
        run: npm run contract:check
      - name: Lint (Biome)
        run: npm run lint
      # `npm run typecheck` delegates to the apps/web workspace (root has
      # no tsconfig since the monorepo move); server keeps its own config.
      - name: tsc (client)
        run: npm run typecheck
      - name: tsc (server)
        run: npm run server:typecheck
      # #142:sidecar 是 workspace 成员,首次纳入 tsc 面(此前仅 tsx 直跑)。
      - name: tsc (yjs-sidecar)
        run: npm run sidecar:typecheck
      # pgvector must be enabled before the Go 服 boots(baseline 含
      # vector 列)。单库(非片)面:本 job 的 DATABASE_URL 兜底目标。
      - name: Enable pgvector extension
        run: >-
          node -e "const {Client}=require('pg');(async()=>{
          const c=new Client({connectionString:process.env.DATABASE_URL});
          await c.connect(); await c.query('CREATE EXTENSION IF NOT EXISTS vector');
          await c.end();})().catch(e=>{console.error(e);process.exit(1)})"
      # #70:TS 迁移器退役。unit 面(yjs-sidecar http 单测读 documents)
      # 仍需 schema——经 cmd/migrate(Go 迁移,同 SUT 启动语义)引导;
      # 各 integration 片的库则由片内 Go 服启动时自行应用。
      - name: Bootstrap unit-test schema
        run: cd apps/server-go && go run ./cmd/migrate
      - name: Unit tests
        run: npm test --silent
      # #143 rider:apps/web 首个单测面(vitest,纯逻辑两模块:roster
      # diff + streaming 合帧),秒级,不动 ser8 时长预算。
      - name: Unit tests (web)
        run: npm run web:test
      # Integration shards: 3 databases on the shared postgres service
      # (service containers pre-create only POSTGRES_DB) + pgvector +
      # schema each. Unit tests above already used cumora_test, shards
      # take cumora_test1..3 — no overlap, so all four datasets coexist.
      # NOTE shell: bash — the job container's default `sh -e` (dash)
      # eats `$1` inside double-quoted node -e scripts (pg bind params)
      # and rejects `set -o pipefail`; the node script below is wrapped
      # in SINGLE quotes so its $ bind params reach node verbatim.
      - name: Create + migrate shard databases (cumora_test1..3)
        shell: bash
        run: |
          set -e
          node -e 'const {Client}=require("pg");(async()=>{
            const admin=new Client({connectionString:process.env.DATABASE_URL});
            await admin.connect();
            for (const db of ["cumora_test1","cumora_test2","cumora_test3"]) {
              const r=await admin.query("SELECT 1 FROM pg_database WHERE datname=$1",[db]);
              if (r.rowCount===0) await admin.query("CREATE DATABASE "+db);
            }
            await admin.end();
            for (const db of ["cumora_test1","cumora_test2","cumora_test3"]) {
              const c=new Client({connectionString:"postgres://cumora:cumora@postgres:5432/"+db});
              await c.connect(); await c.query("CREATE EXTENSION IF NOT EXISTS vector");
              await c.end();
            }
          })().catch(e=>{console.error(e);process.exit(1)})'
          # schema:各片的 Go 服(run-integration-tests.mjs)启动时应用
      # One shard per database + Redis instance (pub/sub is instance-wide
      # — separate Redis DB indexes would still cross-talk). Shards run
      # in parallel; each stays internally serial via
      # --test-concurrency=1 (run-integration-tests.mjs). SUT 二进制先
      # 建一次,三片经 INTEGRATION_GO_BIN 复用(不竞抢构建)。sed -u
      # keeps the [shardN] prefixes unbuffered so the interleaved step
      # output stays live and readable.
      - name: Build integration SUT binary
        env:
          GOFLAGS: -buildvcs=false
        run: cd apps/server-go && go build -o .integration-server-bin ./cmd/server
      - name: Integration tests (3 shards, own DB + Redis each)
        shell: bash
        run: |
          set -e -o pipefail
          run_shard() {
            i="$1"; redis_name="$2"
            INTEGRATION_SHARD="$i/3" \
            INTEGRATION_DATABASE_URL="postgres://cumora:cumora@postgres:5432/cumora_test$i" \
            REDIS_URL="redis://$redis_name:6379" \
            INTEGRATION_GO_BIN="$GITHUB_WORKSPACE/apps/server-go/.integration-server-bin" \
            npm run test:integration 2>&1 | sed -u "s/^/[shard$i] /"
          }
          run_shard 1 redis  & p1=$!
          run_shard 2 redis2 & p2=$!
          run_shard 3 redis3 & p3=$!
          rc=0
          wait "$p1" || rc=1
          wait "$p2" || rc=1
          wait "$p3" || rc=1
          exit $rc
      # The container runs as root but shares the workspace with the host
      # runner user — give ownership back so the runner's next workspace
      # cleanup can delete it. Without this, root-owned files from the
      # container break the next job's checkout with EACCES.
      - name: Restore workspace ownership for the host runner
        if: always()
        run: |
          WS_DIR="$(dirname "$GITHUB_WORKSPACE")"
          chown -R "$(stat -c %u:%g "$WS_DIR")" "$WS_DIR"
